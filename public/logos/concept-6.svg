<svg width="320" height="200" viewBox="0 0 160 100" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Concept 6 — Wordmark Mandapam with stylized a">
  <defs>
    <linearGradient id="m6gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F4D03F" />
      <stop offset="100%" stop-color="#D4A574" />
    </linearGradient>
    <linearGradient id="m6maroon" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8B1E3F" />
      <stop offset="100%" stop-color="#6B0F2A" />
    </linearGradient>
  </defs>

  <!-- Background (transparent — wordmark works on any bg) -->
  <rect width="160" height="100" fill="#FFFEF8" />

  <!-- "Mandapam" wordmark with stylized second 'a' as mandap dome -->
  <text x="80" y="62" font-family="Georgia, 'Times New Roman', serif" font-size="32" font-weight="700" text-anchor="middle" fill="url(#m6maroon)" letter-spacing="-0.5">
    <tspan>M</tspan><tspan>a</tspan><tspan>n</tspan><tspan>d</tspan>
    <!-- Stylized 'a' replaced with dome shape -->
  </text>

  <!-- Mandap dome replacing the second 'a' (positioned at ~95) -->
  <g transform="translate(94, 36)">
    <path d="M 0 26 L 0 16 Q 0 6 8 6 Q 16 6 16 16 L 16 26 Z" fill="url(#m6gold)" />
    <circle cx="8" cy="3" r="1.5" fill="url(#m6gold)" />
    <line x1="8" y1="-1" x2="8" y2="2" stroke="url(#m6gold)" stroke-width="1" stroke-linecap="round" />
  </g>

  <!-- Continue wordmark after stylized a -->
  <text x="120" y="62" font-family="Georgia, 'Times New Roman', serif" font-size="32" font-weight="700" fill="url(#m6maroon)" letter-spacing="-0.5">pam</text>

  <!-- Tagline -->
  <text x="80" y="82" font-family="Georgia, serif" font-size="8" text-anchor="middle" fill="#D4A574" letter-spacing="3" text-transform="uppercase">WEDDINGS · VENUES · MEMORIES</text>
</svg>

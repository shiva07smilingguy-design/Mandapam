<svg width="200" height="200" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Concept 7 — Mandap Arch with couple silhouettes">
  <defs>
    <linearGradient id="m7maroon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8B1E3F" />
      <stop offset="100%" stop-color="#6B0F2A" />
    </linearGradient>
    <linearGradient id="m7gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F4D03F" />
      <stop offset="100%" stop-color="#D4A574" />
    </linearGradient>
  </defs>
  <!-- Maroon circle -->
  <circle cx="32" cy="32" r="30" fill="url(#m7maroon)" />

  <!-- Mandap arch (filled with darker maroon for contrast) -->
  <path d="M 14 50 L 14 28 Q 14 12 32 12 Q 50 12 50 28 L 50 50 Z"
        fill="#6B0F2A" stroke="url(#m7gold)" stroke-width="2" stroke-linejoin="round" />

  <!-- Decorative top finial -->
  <circle cx="32" cy="10" r="1.5" fill="url(#m7gold)" />
  <line x1="32" y1="6" x2="32" y2="9" stroke="url(#m7gold)" stroke-width="1" stroke-linecap="round" />

  <!-- Pillars (left and right) -->
  <line x1="16" y1="30" x2="16" y2="50" stroke="url(#m7gold)" stroke-width="1.5" stroke-linecap="round" />
  <line x1="48" y1="30" x2="48" y2="50" stroke="url(#m7gold)" stroke-width="1.5" stroke-linecap="round" />

  <!-- Heart between heads (above the couple) -->
  <path d="M 32 22 C 31 20.5, 28.5 20.5, 28.5 23 C 28.5 25, 32 27.5, 32 27.5 C 32 27.5, 35.5 25, 35.5 23 C 35.5 20.5, 33 20.5, 32 22 Z"
        fill="url(#m7gold)" />

  <!-- Groom silhouette (left, with turban) -->
  <g fill="url(#m7gold)">
    <!-- Turban -->
    <ellipse cx="27" cy="32" rx="3" ry="1.5" />
    <path d="M 24 32 Q 27 29 30 32 L 30 33 L 24 33 Z" />
    <!-- Head -->
    <circle cx="27" cy="35" r="2" />
    <!-- Body (shoulders + torso) -->
    <path d="M 23 50 L 23 40 Q 23 37 27 37 Q 31 37 31 40 L 31 50 Z" />
  </g>

  <!-- Bride silhouette (right, with veil) -->
  <g fill="#FFFFFF" opacity="0.95">
    <!-- Veil (flowing) -->
    <path d="M 33 32 Q 37 28 41 32 L 42 50 L 34 50 Z" opacity="0.7" />
    <!-- Head -->
    <circle cx="37" cy="35" r="2" />
    <!-- Body -->
    <path d="M 33 50 L 33 40 Q 33 37 37 37 Q 41 37 41 40 L 41 50 Z" />
  </g>

  <!-- Decorative base -->
  <rect x="12" y="50" width="40" height="2" rx="0.5" fill="url(#m7gold)" />
</svg>

<svg width="200" height="200" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Concept 8 — Geometric mandala M">
  <defs>
    <linearGradient id="m8maroon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8B1E3F" />
      <stop offset="100%" stop-color="#6B0F2A" />
    </linearGradient>
    <linearGradient id="m8gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F4D03F" />
      <stop offset="100%" stop-color="#D4A574" />
    </linearGradient>
  </defs>
  <!-- Maroon circle -->
  <circle cx="32" cy="32" r="30" fill="url(#m8maroon)" />

  <!-- 12 outer petals (mandala) -->
  <g stroke="url(#m8gold)" stroke-width="1" fill="none" opacity="0.6">
    <!-- Petals arranged in 12 positions (every 30deg) -->
    <g transform="rotate(0 32 32)"><path d="M 32 6 Q 34 12 32 18 Q 30 12 32 6 Z" fill="url(#m8gold)" opacity="0.7" /></g>
    <g transform="rotate(30 32 32)"><path d="M 32 6 Q 34 12 32 18 Q 30 12 32 6 Z" fill="url(#m8gold)" opacity="0.5" /></g>
    <g transform="rotate(60 32 32)"><path d="M 32 6 Q 34 12 32 18 Q 30 12 32 6 Z" fill="url(#m8gold)" opacity="0.7" /></g>
    <g transform="rotate(90 32 32)"><path d="M 32 6 Q 34 12 32 18 Q 30 12 32 6 Z" fill="url(#m8gold)" opacity="0.5" /></g>
    <g transform="rotate(120 32 32)"><path d="M 32 6 Q 34 12 32 18 Q 30 12 32 6 Z" fill="url(#m8gold)" opacity="0.7" /></g>
    <g transform="rotate(150 32 32)"><path d="M 32 6 Q 34 12 32 18 Q 30 12 32 6 Z" fill="url(#m8gold)" opacity="0.5" /></g>
    <g transform="rotate(180 32 32)"><path d="M 32 6 Q 34 12 32 18 Q 30 12 32 6 Z" fill="url(#m8gold)" opacity="0.7" /></g>
    <g transform="rotate(210 32 32)"><path d="M 32 6 Q 34 12 32 18 Q 30 12 32 6 Z" fill="url(#m8gold)" opacity="0.5" /></g>
    <g transform="rotate(240 32 32)"><path d="M 32 6 Q 34 12 32 18 Q 30 12 32 6 Z" fill="url(#m8gold)" opacity="0.7" /></g>
    <g transform="rotate(270 32 32)"><path d="M 32 6 Q 34 12 32 18 Q 30 12 32 6 Z" fill="url(#m8gold)" opacity="0.5" /></g>
    <g transform="rotate(300 32 32)"><path d="M 32 6 Q 34 12 32 18 Q 30 12 32 6 Z" fill="url(#m8gold)" opacity="0.7" /></g>
    <g transform="rotate(330 32 32)"><path d="M 32 6 Q 34 12 32 18 Q 30 12 32 6 Z" fill="url(#m8gold)" opacity="0.5" /></g>
  </g>

  <!-- Inner gold ring -->
  <circle cx="32" cy="32" r="14" stroke="url(#m8gold)" stroke-width="1.5" fill="none" />
  <circle cx="32" cy="32" r="11" stroke="url(#m8gold)" stroke-width="0.5" fill="none" opacity="0.6" />

  <!-- M in center -->
  <text x="32" y="40" font-family="Georgia, 'Times New Roman', serif" font-size="18" font-weight="700" text-anchor="middle" fill="url(#m8gold)">M</text>
</svg>

<svg width="200" height="200" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Concept 5 — Mandap Arch with Diya flame">
  <defs>
    <linearGradient id="m5maroon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8B1E3F" />
      <stop offset="100%" stop-color="#6B0F2A" />
    </linearGradient>
    <linearGradient id="m5gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F4D03F" />
      <stop offset="100%" stop-color="#D4A574" />
    </linearGradient>
    <linearGradient id="m5flame" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFF8DC" />
      <stop offset="50%" stop-color="#FFA500" />
      <stop offset="100%" stop-color="#FF4500" />
    </linearGradient>
  </defs>
  <!-- Maroon circle -->
  <circle cx="32" cy="32" r="30" fill="url(#m5maroon)" />

  <!-- Mandap arch (filled) -->
  <path d="M 14 50 L 14 28 Q 14 12 32 12 Q 50 12 50 28 L 50 50 Z"
        fill="none" stroke="url(#m5gold)" stroke-width="2.5" stroke-linejoin="round" />

  <!-- Diya bowl (boat shape) -->
  <path d="M 22 38 Q 32 44 42 38 Q 40 42 32 42 Q 24 42 22 38 Z" fill="url(#m5gold)" />
  <path d="M 22 38 Q 32 34 42 38" stroke="url(#m5gold)" stroke-width="2" fill="none" />

  <!-- Flame -->
  <path d="M 32 38 Q 28 32 30 26 Q 32 22 32 20 Q 34 22 34 26 Q 36 32 32 38 Z" fill="url(#m5flame)" />
  <!-- Flame inner -->
  <path d="M 32 36 Q 30 32 31 28 Q 32 26 32 24 Q 33 26 33 28 Q 34 32 32 36 Z" fill="#FFF8DC" opacity="0.8" />

  <!-- Decorative base -->
  <rect x="12" y="50" width="40" height="2" rx="0.5" fill="url(#m5gold)" />

  <!-- Small dots on arch (rangoli hint) -->
  <circle cx="20" cy="22" r="0.8" fill="url(#m5gold)" />
  <circle cx="44" cy="22" r="0.8" fill="url(#m5gold)" />
  <circle cx="32" cy="14" r="0.8" fill="url(#m5gold)" />
</svg>
